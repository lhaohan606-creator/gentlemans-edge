<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>预约功能已关闭</title>
<style>
  body { margin:0; font-family:'Microsoft YaHei',Arial,sans-serif; background:#f6f7fb; color:#172033; min-height:100vh; display:flex; align-items:center; justify-content:center; }
  .box { text-align:center; background:#fff; border:1px solid #e7e9f2; border-radius:16px; padding:48px 40px; max-width:420px; width:90%; box-shadow:0 8px 24px rgba(31,41,55,.06); }
  .icon { font-size:3.2em; margin-bottom:16px; }
  h1 { font-size:1.4em; margin:0 0 10px; }
  p { color:#6b7280; line-height:1.7; margin:0 0 6px; }
  a.btn { display:inline-block; margin-top:18px; padding:10px 22px; border-radius:9px; background:#4f46e5; color:#fff; text-decoration:none; font-weight:600; }
</style>
</head>
<body>
<div class="box">
  <div class="icon">🕐</div>
  <h1>在线预约已关闭</h1>
  <p>本店已停止在线预约服务，</p>
  <p>欢迎直接到店，或电话联系门店。</p>
  <a class="btn" href="./">返回门店管理系统</a>
</div>
</body>
</html>
